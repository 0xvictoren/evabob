# Evabob hosted Arc testnet on Render.
# Secret values are entered in the Render Dashboard during the first Blueprint
# sync. Never copy values from server/.env into this file.
services:
  - type: web
    name: evabob-api-testnet
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: server
    numInstances: 1
    buildCommand: npm ci --legacy-peer-deps --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    disk:
      name: evabob-api-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: EVABOB_ENV
        value: testnet
      - key: ENABLE_PRODUCTION_LAUNCH
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/evabob
      - key: APP_NAME
        value: evabob
      - key: ALLOW_HEADER_AUTH
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: RUN_INTERNAL_REFUND_JOB
        value: "false"
      - key: API_PUBLIC_URL
        fromService:
          type: web
          name: evabob-api-testnet
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_PUBLIC_URL
        fromService:
          type: web
          name: evabob-web-testnet
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: evabob-web-testnet
          envVarKey: RENDER_EXTERNAL_URL
      - key: CRON_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: evabob_testnet
      - key: DYNAMIC_ENVIRONMENT_ID
        sync: false
      - key: DYNAMIC_API_TOKEN
        sync: false
      - key: DYNAMIC_JWT_AUDIENCE
        value: https://evabob.app
      # Reject every Dynamic JWT issued before the HTTP-transport incident
      # cutoff. Testers must sign in again after installing the HTTPS build.
      - key: AUTH_SESSION_INVALID_BEFORE
        value: "2026-09-21T10:11:00Z"
      - key: CIRCLE_WALLETS_APP_ID
        sync: false
      - key: CIRCLE_API_KEY
        sync: false
      - key: CIRCLE_ENTITY_SECRET
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: IDENTITY_LINKER_PRIVATE_KEY
        sync: false
      - key: ESCROW_ATTESTOR_PRIVATE_KEY
        sync: false
      - key: OPERATOR_USER_IDS
        sync: false
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: ARC_CHAIN_ID
        value: "5042002"
      - key: GATEWAY_API_BASE
        value: https://gateway-api-testnet.circle.com/v1
      - key: ADMIN_SAFE_ADDRESS
        value: "0xe2Ef46038d30F80B39DA2E775F637BE2fa2635A2"
      - key: IDENTITY_REGISTRY
        value: "0x7a74c86b6fd0b0232d5d1eb0074547dfe1a4ffd0"
      - key: ESCROW_IDENTITY_REGISTRY
        value: "0xb14355288fcE19811cccaF1589ea85e3791320a0"
      - key: MONEY_CIRCLES_ADDRESS
        value: "0x482497289a4F5197f67f98B2535cd23D6238d256"
      - key: GROUP_POTS_ADDRESS
        value: "0x3CBDdab2398e06d5FB496a9DbF9424abD449D795"
      - key: PAYMENT_ESCROW
        value: "0x37Cb011C7a53e52f569b9c388B6208A71cD0Df39"
      - key: USE_APP_KIT
        value: "true"
      - key: APP_KIT_ADAPTER
        value: circle-wallets
      - key: APP_KIT_KEEP_LEGACY
        value: "true"
      - key: APP_KIT_DC_WALLET
        sync: false
      - key: KIT_KEY
        sync: false
      # Evabob platform fee: 0.05% on top of every payment, gas excluded.
      # Leave the address empty to charge nothing.
      - key: PLATFORM_FEE_ADDRESS
        sync: false
      - key: PLATFORM_FEE_BPS
        value: "5"
      - key: FEATURE_DIRECT_SEND
        value: "true"
      - key: FEATURE_PROTECTED_SEND
        value: "true"
      - key: FEATURE_REQUESTS
        value: "true"
      - key: FEATURE_GATEWAY
        value: "true"
      - key: FEATURE_CONVERSION
        value: "true"
      - key: FEATURE_BRIDGE_ROUTES
        value: "Arc_Testnet:Base_Sepolia,Base_Sepolia:Arc_Testnet,Arc_Testnet:Ethereum_Sepolia,Ethereum_Sepolia:Arc_Testnet,Base_Sepolia:Ethereum_Sepolia,Ethereum_Sepolia:Base_Sepolia"
      - key: FEATURE_AGENT_WALLETS
        value: "true"
      - key: FEATURE_X402_EXECUTION
        value: "true"
      - key: FEATURE_ONCHAIN_EMAIL_LINKS
        value: "true"
      - key: FEATURE_ONCHAIN_MEMOS
        value: "true"
      - key: FEATURE_EXTERNAL_LLM
        value: "true"
      - key: MEMO_CONTRACT_ADDRESS
        value: "0x4a5F9daB431C9D8f5E678c00D2865CAD1F685500"
      - key: FEATURE_AGENT_BATCH_SEND
        value: "true"
      - key: AGENT_MAX_DAILY_LIMIT_USDC
        value: "100"
      - key: AGENT_MAX_USER_DAILY_SPEND_USDC
        value: "250"
      - key: AGENT_RESOURCE_ORIGINS
        value: circle-marketplace
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SYNTHRA_API_KEY
        sync: false
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: PUSHER_CLUSTER
        value: mt1
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Evabob <evabobxyz@gmail.com>"
      - key: SMTP_SECURE
        value: "false"

  - type: web
    name: evabob-web-testnet
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: EVABOB_API_BASE_URL
        fromService:
          type: web
          name: evabob-api-testnet
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: evabob-api-testnet
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_ANDROID_APP_URL
        value: ""
      - key: NEXT_PUBLIC_IOS_APP_URL
        value: ""

  - type: cron
    name: evabob-refunds-testnet
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: server
    # Every 5 minutes: releases due held payments (7-day jobs, 10-minute
    # cooling-off), finishes bridges abandoned for 40+ minutes, and sweeps
    # expired holds. See /internal/cron/tick.
    schedule: "*/5 * * * *"
    buildCommand: npm ci --legacy-peer-deps
    startCommand: npm run cron:tick
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_PUBLIC_URL
        fromService:
          type: web
          name: evabob-api-testnet
          envVarKey: RENDER_EXTERNAL_URL
      - key: CRON_SECRET
        fromService:
          type: web
          name: evabob-api-testnet
          envVarKey: CRON_SECRET
